function blankState(){return {version:VERSION,dailyKey:'',weeklyKey:'',daily:{},weekly:{},customDaily:[],customWeekly:[],longterm:{},life:{},lifeNotes:{},carrack:{},carrackGear:{},periodic:{},notes:{global:''},passCount:0};}

function kstParts(d=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:KST,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);const o={};p.forEach(x=>o[x.type]=x.value);return o;}
function dailyKey(){const p=kstParts();return `${p.year}-${p.month}-${p.day}`;}
function weeklyKey(){const p=kstParts();const base=new Date(`${p.year}-${p.month}-${p.day}T12:00:00+09:00`);const day=base.getUTCDay(); // KST noon still same weekday in UTC enough for date math
  const kstDay=new Date(base.toLocaleString('en-US',{timeZone:KST})).getDay();
  const delta=(kstDay-4+7)%7; base.setDate(base.getDate()-delta); const q=kstParts(base); return `${q.year}-${q.month}-${q.day}`;}
function resetPeriods(){const dk=dailyKey(),wk=weeklyKey();if(state.dailyKey!==dk){state.dailyKey=dk;state.daily={};}if(state.weeklyKey!==wk){state.weeklyKey=wk;state.weekly={};}save();}

function carrackRow(m){const [name,target,use,src]=m;const cur=Number(state.carrack[name]||0);const lack=Math.max(0,target-cur);return `<div class="mat-row"><b>${esc(name)}</b><input type="number" min="0" value="${cur}" data-mat="${esc(name)}"><span>${target}</span><span>${lack}</span><span class="short">${esc(use)} · ${esc(src)}</span></div>`;}
function renderCarrack(){const gear=CARRACK_GEAR.map((g,i)=>{const a=state.carrackGear['g'+i]||{};return `<div class="card span-6"><h3>${esc(g.name)}</h3><label class="task"><input type="checkbox" data-gear="g${i}_base" ${a.base?'checked':''}><div><div class="task-title">${esc(g.base)} 준비</div></div></label><label class="task"><input type="checkbox" data-gear="g${i}_craft" ${a.craft?'checked':''}><div><div class="task-title">제작 완료</div><div class="task-desc">${esc(g.mats)}</div></div></label><label class="task"><input type="checkbox" data-gear="g${i}_plus" ${a.plus?'checked':''}><div><div class="task-title">+10 완료</div></div></label></div>`}).join('');document.getElementById('carrack').innerHTML=`<div class="grid"><div class="card span-12"><h2>항해 스페셜 패스</h2><div class="progress-line"><span>물물교환 횟수</span><b><span id="passNum">${Number(state.passCount||0)}</span> / 400</b></div><input type="number" min="0" max="400" value="${Number(state.passCount||0)}" data-pass style="margin-top:8px;width:120px;background:#11151b;border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px"><div class="progress"><div style="width:${Math.min(100,Number(state.passCount||0)/4)}%"></div></div><div class="hint" style="margin-top:8px">선택상자는 자연수급/일퀘/주간/물교 후 실제 부족량을 보고 마지막에 사용.</div></div>${gear}<div class="card span-12"><h2>재료 트래커</h2><div class="mat-row header"><span>재료</span><span>보유</span><span>목표</span><span>부족</span><span>용도 / 주요 수급</span></div>${CARRACK_MATS.map(carrackRow).join('')}</div><div class="card span-12"><h2>점진 본체 최종 체크</h2><div class="hint">+10 흑룡 선수상 / +10 개량형 장갑 / +10 메이나 함포 / +10 비층 바람 돛 + 아마포 180 + 짙은 각목 144 + 화려한 암염 35 + 화려한 진주 35 + 심해의 눈물 42</div></div></div>`;}
function renderPeriodic(){document.getElementById('periodic').innerHTML=`<div class="grid"><div class="card span-12"><h2>주간 초기화와 분리한 항목</h2><div class="hint">기간제 이벤트와 생성형 콘텐츠는 목요일 초기화 체크리스트에 섞지 않는다.</div></div>${PERIODIC.map(x=>{const chk=!!state.periodic[x.id];return `<div class="card span-6"><div class="task ${chk?'done':''}"><input type="checkbox" data-periodic="${x.id}" ${chk?'checked':''}><div><div class="task-title">${esc(x.title)}</div><div class="task-desc">${esc(x.desc)}${x.until?` · 종료 ${x.until}`:''}</div></div><span class="badge ${x.tag}">${x.tag==='event'?'기간제':'주기성'}</span></div></div>`}).join('')}</div>`;}
function renderSources(){document.getElementById('sources').innerHTML=`<div class="grid"><div class="card span-8"><h2>검증 링크</h2>${SOURCES.map(([t,u])=>`<div class="source"><a href="${u}" target="_blank" rel="noreferrer">${esc(t)}</a></div>`).join('')}</div><div class="card span-4"><h2>데이터 기준</h2><div class="hint">2026-09-02 기준. 패치로 변하기 쉬운 보상/장비/주간 구조는 공식 업데이트 우선. 커뮤니티 자료는 실제 루틴/사용성 보조로만 사용.</div><div class="divider"></div><h3>앱 특성</h3><ul class="mini-list"><li>인터넷 없이 열림</li><li>서버 전송 없음</li><li>체크/수량 브라우저 저장</li><li>JSON 백업/복원 가능</li></ul></div></div>`;}
function renderAll(){renderToday();renderWeekly();renderProgress();renderLife();renderCarrack();renderPeriodic();renderSources();bind();updateStats();}
function bind(){const adb=document.getElementById('addDailyBtn');if(adb)adb.onclick=()=>addCustom('daily');const awb=document.getElementById('addWeeklyBtn');if(awb)awb.onclick=()=>addCustom('weekly');document.querySelectorAll('input[data-group]').forEach(el=>el.onchange=()=>{state[el.dataset.group][el.dataset.id]=el.checked;save();renderAll();});document.querySelectorAll('textarea[data-note]').forEach(el=>el.oninput=()=>{state.notes[el.dataset.note]=el.value;save();});document.querySelectorAll('select[data-long-select]').forEach(el=>el.onchange=()=>{state.longterm[el.dataset.longSelect]=el.value;save();renderAll();});document.querySelectorAll('input[data-long]').forEach(el=>el.onchange=()=>{state.longterm[el.dataset.long]=el.checked?'완료':'진행중';save();renderAll();});document.querySelectorAll('select[data-life]').forEach(el=>el.onchange=()=>{state.life[el.dataset.life]=el.value;save();updateStats();});document.querySelectorAll('textarea[data-life-note]').forEach(el=>el.oninput=()=>{state.lifeNotes[el.dataset.lifeNote]=el.value;save();});document.querySelectorAll('input[data-mat]').forEach(el=>el.onchange=()=>{state.carrack[el.dataset.mat]=Math.max(0,Number(el.value||0));save();renderCarrack();bind();});document.querySelectorAll('input[data-gear]').forEach(el=>el.onchange=()=>{const [g,k]=el.dataset.gear.split('_');state.carrackGear[g]=state.carrackGear[g]||{};state.carrackGear[g][k]=el.checked;save();});document.querySelectorAll('input[data-periodic]').forEach(el=>el.onchange=()=>{state.periodic[el.dataset.periodic]=el.checked;save();renderPeriodic();bind();});const pass=document.querySelector('input[data-pass]');if(pass)pass.onchange=()=>{state.passCount=Math.min(400,Math.max(0,Number(pass.value||0)));save();renderCarrack();bind();};}
function addCustom(kind){const isDaily=kind==='daily';const input=document.getElementById(isDaily?'customDailyTitle':'customWeeklyTitle');const title=(input?.value||'').trim();if(!title)return;const arr=isDaily?(state.customDaily||[]):(state.customWeekly||[]);arr.push({id:`custom_${kind}_${Date.now()}`,cat:'내 항목',title,desc:'사용자 추가 항목',tag:'optional'});if(isDaily)state.customDaily=arr;else state.customWeekly=arr;save();renderAll();toast('항목 추가 완료');}
function updateStats(){const allD=[...DAILY,...(state.customDaily||[])],allW=[...WEEKLY,...(state.customWeekly||[])];const d=allD.filter(x=>state.daily[x.id]).length,w=allW.filter(x=>state.weekly[x.id]).length;document.getElementById('dailyStat').textContent=`${d}/${allD.length}`;document.getElementById('weeklyStat').textContent=`${w}/${allW.length}`;let target=0,have=0;CARRACK_MATS.forEach(([n,t])=>{target+=t;have+=Math.min(t,Number(state.carrack[n]||0));});document.getElementById('carrackStat').textContent=`${Math.round(have/target*100)||0}%`;const lc=LIFE.filter(x=>(state.life[x.id]||x.status)==='완료').length;document.getElementById('lifeStat').textContent=`${lc}/${LIFE.length}`;}
function setTab(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));const t=navItems.find(x=>x[0]===id);document.getElementById('pageTitle').textContent=t?t[1]:id;location.hash=id;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`bdo-dashboard-backup-${dailyKey()}.json`;a.click();URL.revokeObjectURL(a.href);}
function importData(file){const r=new FileReader();r.onload=()=>{try{state=Object.assign(blankState(),JSON.parse(r.result));save();resetPeriods();renderAll();toast('백업 복원 완료');}catch(e){alert('JSON 백업 파일을 읽지 못했습니다.');}};r.readAsText(file);}
function resetCurrent(){const id=(location.hash||'#today').slice(1);if(!confirm(`${navItems.find(x=>x[0]===id)?.[1]||id}의 체크 상태를 초기화할까요?`))return;if(id==='today')state.daily={};else if(id==='weekly')state.weekly={};else if(id==='periodic')state.periodic={};else if(id==='carrack'){state.carrackGear={};}else if(id==='progress')state.longterm={};else if(id==='life')state.life={};save();renderAll();toast('초기화 완료');}
function init(){const nav=document.getElementById('nav');navItems.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.tab=id;b.onclick=()=>setTab(id);nav.appendChild(b);});resetPeriods();renderAll();const hash=(location.hash||'#today').slice(1);setTab(navItems.some(x=>x[0]===hash)?hash:'today');document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);document.getElementById('resetBtn').onclick=resetCurrent;setInterval(()=>{const p=kstParts();document.getElementById('clock').textContent=`KST ${p.year}-${p.month}-${p.day} ${p.weekday} ${p.hour}:${p.minute}:${p.second} · 일일 00:00 / 주간 목요일 00:00 자동 초기화`;resetPeriods();},1000);}
init();
</script>
</body>
</html>
